<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Voyageur Expéditions</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="dashboard">

<header>

    <div class="logo">
        <span>VOYAGEUR</span>
        EXPÉDITIONS
    </div>

    <nav>

        <a href="index.html">
            Ver site
        </a>

    </nav>

</header>


<main class="pagina">

    <section class="dashboard-top">

        <span class="mini-titulo">
            PAINEL ADMINISTRATIVO
        </span>

        <h1>
            Dashboard
        </h1>

    </section>


    <section class="estatisticas">

        <div>
            <span>Reservas</span>
            <strong id="totalReservas">
                0
            </strong>
        </div>


        <div>
            <span>Passageiros</span>
            <strong id="totalPassageiros">
                0
            </strong>
        </div>


        <div>
            <span>Mensagens</span>
            <strong id="totalMensagens">
                0
            </strong>
        </div>

    </section>


    <section class="tabela">

        <h2>
            Reservas recentes
        </h2>

        <table>

            <thead>

                <tr>

                    <th>
                        Nome
                    </th>

                    <th>
                        Telefone
                    </th>

                    <th>
                        Data
                    </th>

                    <th>
                        Passageiros
                    </th>

                    <th>
                        Pagamento
                    </th>

                </tr>

            </thead>


            <tbody id="listaReservas">

            </tbody>

        </table>

    </section>

</main>


<footer>

    <p>
        Voyageur Expéditions.
    </p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
